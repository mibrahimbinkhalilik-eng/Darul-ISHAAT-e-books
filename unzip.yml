name: Unpack site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into folders
        run: |
          mkdir -p api
          [ -f payfast-webhook.js ] && mv -f payfast-webhook.js api/payfast-webhook.js || true
          [ -f app.js ] && mv -f app.js assets/js/app.js || true
          [ -f reader.js ] && mv -f reader.js assets/js/reader.js || true
          [ -f style.css ] && mv -f style.css assets/css/style.css || true
          [ -f catalog.js ] && mv -f catalog.js data/catalog.js || true
          [ -f series.js ] && mv -f series.js data/series.js || true
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Move files into folders"
          git push
