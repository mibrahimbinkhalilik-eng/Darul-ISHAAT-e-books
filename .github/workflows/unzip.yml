name: Unpack site
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move files into folders
        run: |
          mkdir -p api assets/js assets/css data
          for f in payfast-webhook.js:api app.js:assets/js reader.js:assets/js style.css:assets/css reader.css:assets/css catalog.js:data series.js:data config.js:assets/js; do
            name="${f%%:*}"; dir="${f##*:}"
            if [ -f "$name" ]; then mv -f "$name" "$dir/$name"; echo "moved $name -> $dir/"; fi
          done
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then echo "nothing to move"; else git commit -m "Move files into folders" && git push; fi
