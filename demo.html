<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo checkout</title>
<style>body{font:17px system-ui;max-width:560px;margin:0 auto;padding:16px;background:#f6f4ef;color:#1a1a1a}.tag{background:#b45309;color:#fff;text-align:center;padding:8px;border-radius:8px;font-weight:700}
.box{background:#fff;border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 1px 4px #0002}.btn{display:block;width:100%;box-sizing:border-box;background:#14532d;color:#fff;text-align:center;padding:14px;border:0;border-radius:10px;font-size:17px;text-decoration:none;margin:8px 0}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid #eee}small{color:#666}</style></head><body>
<div class="tag">DEMO ONLY - no real payment, no gateway</div>
<div class="box" id="a"></div>
<script src="data/catalog.js"></script>
<script>
var C=window.CATALOG||[],ids=[];try{ids=Object.keys(JSON.parse(localStorage.cart||"{}"))}catch(e){}
var U=new URLSearchParams(location.search),q=U.get("ids"),NM=U.get("n")||"Customer",PH=U.get("p")||"";if(q)ids=q.split(",");
var bs=C.filter(function(b){return ids.indexOf(b.id)>-1}),tot=bs.reduce(function(s,b){return s+b.price},0),a=document.getElementById("a");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
if(!bs.length)a.innerHTML="<p>Your cart is empty.</p><a class=btn href='index.html'>Back to the library</a>";
else{a.innerHTML="<h2>Demo checkout</h2>"+bs.map(function(b){return"<div class=row><span>"+esc(b.title)+"</span><b>Rs. "+b.price+"</b></div>"}).join("")+"<p><b>Total: Rs. "+tot+"</b></p><button class=btn id=p>Pay (demo)</button><small>Pressing this does not charge anything.</small>";
document.getElementById("p").onclick=function(){a.innerHTML="<h2>Payment successful (DEMO)</h2>"+bs.map(function(b){return"<button class=btn data-id='"+esc(b.id)+"'>Download PDF: "+esc(b.title)+"</button>"}).join("")+"<p id=st style='color:#14532d'></p>"+"<small>Your PDF is stamped with your name and number: "+esc(NM)+" / "+esc(PH)+". Demo files contain only the first 12 pages. The real store will send the full book after a real payment.</small><a class=btn style='background:#555' href='index.html'>Back to the library</a>";try{localStorage.cart="{}"}catch(e){}}}

function mkpdf(pages){var enc=new TextEncoder(),parts=[],off=[],len=0;function add(x){if(typeof x=="string")x=enc.encode(x);parts.push(x);len+=x.length}
function obj(n,body){off[n]=len;add(n+" 0 obj\n");if(typeof body=="string")add(body);else{body.forEach(add)}add("\nendobj\n")}
add("%PDF-1.4\n");var n=pages.length,kids=[];for(var i=0;i<n;i++)kids.push((3+i*3)+" 0 R");
obj(1,"<< /Type /Catalog /Pages 2 0 R >>");obj(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
pages.forEach(function(p,i){var b=3+i*3,c="q "+p.w+" 0 0 "+p.h+" 0 0 cm /I Do Q";
obj(b,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+p.w+" "+p.h+"] /Resources << /XObject << /I "+(b+2)+" 0 R >> >> /Contents "+(b+1)+" 0 R >>");
obj(b+1,"<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");
obj(b+2,["<< /Type /XObject /Subtype /Image /Width "+p.w+" /Height "+p.h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+p.jpg.length+" >>\nstream\n",p.jpg,"\nendstream"])});
var xr=len,tot=3+n*3;add("xref\n0 "+tot+"\n0000000000 65535 f \n");for(var k=1;k<tot;k++)add(("0000000000"+off[k]).slice(-10)+" 00000 n \n");
add("trailer\n<< /Size "+tot+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF");
var out=new Uint8Array(len),o=0;parts.forEach(function(x){out.set(x,o);o+=x.length});return new Blob([out],{type:"application/pdf"})}
function stamp(img){var c=document.createElement("canvas");c.width=img.naturalWidth;c.height=img.naturalHeight;var x=c.getContext("2d");x.drawImage(img,0,0);
var t=NM+" - "+PH,fs=Math.max(14,Math.round(c.width/22));x.font="bold "+fs+"px sans-serif";x.fillStyle="rgba(90,90,90,.20)";x.textAlign="center";
x.save();x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/5);for(var yy=-c.height;yy<c.height;yy+=fs*4)x.fillText(t,0,yy);x.restore();
x.font=Math.max(10,Math.round(fs*.6))+"px sans-serif";x.fillStyle="rgba(60,60,60,.7)";x.fillText("Licensed to "+t,c.width/2,c.height-8);
return new Promise(function(r){c.toBlob(function(b){b.arrayBuffer().then(function(a){r({w:c.width,h:c.height,jpg:new Uint8Array(a)})})},"image/jpeg",.78)})}
function loadImg(u){return new Promise(function(r,j){var i=new Image();i.onload=function(){r(i)};i.onerror=j;i.src=u})}
async function build(id,btn){var st=document.getElementById("st"),pg=[];btn.disabled=true;try{for(var p=1;p<=12;p++){st.textContent="Preparing PDF... page "+p+"/12";var im=await loadImg("books/"+encodeURIComponent(id)+"/pages/"+String(p).padStart(4,"0")+".webp");pg.push(await stamp(im))}
var bl=mkpdf(pg),a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download=id+"-demo.pdf";document.body.appendChild(a);a.click();st.textContent="Done. Your PDF is saved."}catch(e){st.textContent="Could not build the PDF: "+e}btn.disabled=false}
document.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest("button[data-id]");if(b)build(b.getAttribute("data-id"),b)});
</script></body></html>
